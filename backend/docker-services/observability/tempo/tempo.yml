---

stream_over_http_enabled: true
server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "tempo:4317"

# Retention is handled by the backend scheduler/worker (formerly the compactor).
# overall Tempo trace retention, set for demo purposes (default 336h)
backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 1h
backend_worker:
  compaction:
    block_retention: 1h

storage:
  trace:
    backend: local # backend configuration to use
    wal:
      path: /var/tempo/wal # where to store the wal locally
    local:
      path: /var/tempo/blocks

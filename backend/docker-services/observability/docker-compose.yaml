---
#
# Compose file to spin up observability tooling/sinks. Usage:
#
#   docker compose -f docker-compose.yaml up [-d]
#
# Configure your project (local runserver!) OTEL endpoint to http://localhost:4317
# (the default) and set
# - OTEL_SDK_DISABLED=false
# - OTEL_EXPORTER_OTLP_METRICS_INSECURE=true
# - OTEL_METRIC_EXPORT_INTERVAL=10000  # export every 10s, if there are metrics
#
services:
  # logs storage
  loki:
    image: grafana/loki:3.7.9
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - oab-dev

  prometheus:
    image: prom/prometheus:v3.15.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-tsdb:/prometheus
    networks:
      - oab-dev

  # log scraping from container output
  alloy:
    image: grafana/alloy:v1.21.3
    ports:
      - "9080:9080"  # Alloy debug UI
    volumes:
      # for service discovery & reading container logs - note that doing this in
      # production is NOT recommended due to security concerns
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # custom config file to scrape container logs
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:9080
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    networks:
      - oab-dev

  # Traces backend
  # Tempo runs as user 10001, and docker compose creates the volume as root.
  # As such, we need to chown the volume in order for Tempo to start correctly.
  # See https://github.com/grafana/tempo/issues/1657
  tempo-init:
    image: busybox:1.36.1
    user: root
    entrypoint:
      - "chown"
      - "10001:10001"
      - "/var/tempo"
    volumes:
      - ./tempo-data:/var/tempo
    networks:
      - oab-dev

  tempo:
    image: grafana/tempo:3.1.1
    command: --config.file=/etc/tempo.yaml
    volumes:
      - ./tempo/tempo.yml:/etc/tempo.yaml
      - ./tempo-data:/var/tempo
    ports:
      - "3200:3200"  # tempo
    networks:
      - oab-dev
    depends_on:
      - tempo-init

  # open telemetry collector, receives metrics from the application instance(s)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    command: --config=/etc/otel-collector-config.yaml
    volumes:
      - ./otel/otel-collector-config.yml:/etc/otel-collector-config.yaml
    ports:
      - 4317:4317
      - 4318:4318
      - 8889:8889
    networks:
      - oab-dev

  # dashboard tool, visualizes telemetry. queries loki and prometheus
  grafana:
    image: grafana/grafana:13.3.0
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_FEATURE_TOGGLES_ENABLE=alertingSimplifiedRouting,alertingQueryAndExpressionsStepMode
    ports:
      - "3000:3000"
    networks:
      - oab-dev

volumes:
  alloy-data:
  prometheus-tsdb:

networks:
  oab-dev:
    name: oab-dev
